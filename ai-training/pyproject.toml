[project]
name = "teethsee-ai-training"
version = "0.1.0"
description = "Patient-grouped dental caries detector training for teethsee"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pillow==12.3.0",
  "safetensors==0.6.2",
  "torch==2.12.0",
  "torchvision==0.27.0",
]

[dependency-groups]
dev = ["pytest==9.0.3"]
export = [
  "onnx>=1.19,<2",
  "onnxscript>=0.5,<0.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teethsee_training"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
