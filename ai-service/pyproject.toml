[project]
name = "teethsee-ai-service"
version = "0.1.0"
description = "Local-first oral image screening service for teethsee"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.5",
  "onnxruntime==1.22.1",
  "pillow==12.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teethsee_ai"]
